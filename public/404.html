    <title>Fisioterapia Armero</title>
    <script>
      // Redirige rutas desconocidas de vuelta al index en GitHub Pages
      var path = window.location.pathname;
      var base = '/';
      sessionStorage.setItem('redirect', path);
      window.location.replace(base);
    </script>
